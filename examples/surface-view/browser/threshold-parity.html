<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="data:,">
    <title>ScalaFIM thresholded surface parity plate</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; background: #0c1118; color: #edf2f7; font: 15px system-ui, sans-serif; }
      main { width: 1240px; margin: 0 auto; padding: 20px 28px 30px; }
      header { display: flex; align-items: end; justify-content: space-between; margin-bottom: 14px; }
      h1 { margin: 0 0 4px; font-size: 25px; }
      p { margin: 3px 0; color: #a9b6c8; }
      .legend { display: flex; gap: 14px; align-items: center; font-size: 13px; }
      .swatch { width: 18px; height: 10px; display: inline-block; border-radius: 2px; margin-right: 5px; }
      .negative { background: rgb(32, 92, 224); }
      .positive { background: rgb(235, 56, 38); }
      .grid { display: grid; grid-template-columns: repeat(2, 600px); gap: 14px; }
      figure { margin: 0; background: #151d28; border: 1px solid #273448; border-radius: 9px; overflow: hidden; }
      figcaption { height: 31px; line-height: 31px; padding-left: 12px; font-weight: 650; letter-spacing: .03em; }
      canvas { width: 600px; height: 450px; display: block; background: white; }
      details { margin-top: 14px; }
      pre { white-space: pre-wrap; color: #b9f6ca; max-height: 45vh; overflow: auto; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Thresholded cortical overlay — Scala.js / WebGL</h1>
          <p id="status">Loading checksum-pinned fsaverage5 left pial surface…</p>
          <p id="runtime-errors">Runtime error audit pending…</p>
        </div>
        <div class="legend">
          <span><i class="swatch negative"></i>z ≤ −2.33</span>
          <span><i class="swatch positive"></i>z ≥ 2.33</span>
          <span>gray = fold underlay</span>
        </div>
      </header>
      <section class="grid">
        <figure><figcaption>VENTRAL</figcaption><canvas width="600" height="450"></canvas></figure>
        <figure><figcaption>LATERAL · LEFT</figcaption><canvas width="600" height="450"></canvas></figure>
        <figure><figcaption>POSTERIOR</figcaption><canvas width="600" height="450"></canvas></figure>
        <figure><figcaption>TOP · DORSAL</figcaption><canvas width="600" height="450"></canvas></figure>
      </section>
      <details><summary>QA receipt</summary><pre id="receipt"></pre></details>
    </main>
    <script type="importmap">
      { "imports": { "three": "../../../../../jscode/surfviewjs/node_modules/three/build/three.module.js" } }
    </script>
    <script>
      window.exports = {};
      window.__scalafimThresholdQaErrors = [];
      window.addEventListener("error", event => window.__scalafimThresholdQaErrors.push(event.error?.stack || event.message));
      window.addEventListener("unhandledrejection", event => window.__scalafimThresholdQaErrors.push(event.reason?.stack || String(event.reason)));
    </script>
    <script src="../js/target/scala-3.4.2/scalafim-examples-surface-view-fastopt/main.js"></script>
    <script type="module">
      import * as THREE from "../../../../../jscode/surfviewjs/node_modules/three/build/three.module.js";
      import { parseGIfTISurface } from "../../../../../jscode/surfviewjs/dist/surfview.es.js";

      const source = {
        url: "../../../../../jscode/surfviewjs/tests/data/fsaverage5-lh-pial.gii",
        sha256: "b425b4914362af4aaf43bb5d022afd39a0c5f6ec4601e353631cdd737884c951"
      };
      const status = document.querySelector("#status");
      const runtimeErrors = document.querySelector("#runtime-errors");
      const receipt = document.querySelector("#receipt");
      const hex = bytes => [...bytes].map(value => value.toString(16).padStart(2, "0")).join("");

      try {
        const started = performance.now();
        const response = await fetch(source.url);
        if (!response.ok) throw new Error(`HTTP ${response.status} loading ${source.url}`);
        const bytes = await response.arrayBuffer();
        const digest = hex(new Uint8Array(await crypto.subtle.digest("SHA-256", bytes)));
        if (digest !== source.sha256) throw new Error(`SHA-256 mismatch: ${digest}`);
        const geometry = parseGIfTISurface(new TextDecoder().decode(bytes));
        const result = exports.mountScalafimThresholdParityPlate(
          THREE,
          [...document.querySelectorAll("canvas")],
          geometry.vertices,
          geometry.faces
        );
        result.sourceSha256 = digest;
        result.fetchParseAndRenderMillis = performance.now() - started;
        const failures = result.cases.flatMap(entry => entry.visualQa.violations.map(reason => `${entry.label}: ${reason}`));
        if (result.cases.length !== 4) failures.push(`expected 4 views; got ${result.cases.length}`);
        if (result.thresholdLower !== -2.33 || result.thresholdUpper !== 2.33) failures.push("threshold drift");
        if (result.visibleNegativeVertices === 0 || result.visiblePositiveVertices === 0) failures.push("one threshold tail is empty");
        result.failures = failures;
        const passed = failures.length === 0;
        document.body.dataset.scalafimThresholdParity = passed ? "pass" : "fail";
        status.textContent = passed
          ? `PASS — ${result.visibleNegativeVertices} negative and ${result.visiblePositiveVertices} positive vertices survive ±2.33`
          : `FAIL — ${failures.join("; ")}`;
        receipt.textContent = JSON.stringify(result, null, 2);
      } catch (error) {
        document.body.dataset.scalafimThresholdParity = "fail";
        status.textContent = "FAIL";
        receipt.textContent = error?.stack || String(error);
      }
      setTimeout(() => {
        const errors = window.__scalafimThresholdQaErrors;
        runtimeErrors.textContent = `Runtime errors: ${errors.length}`;
        if (errors.length > 0) {
          document.body.dataset.scalafimThresholdParity = "fail";
          status.textContent = `FAIL — ${errors.join("; ")}`;
        }
      }, 0);
    </script>
  </body>
</html>
