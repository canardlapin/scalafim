name: first-level-laws-calibration
run-name: published Gale adoption on Linux JDK17
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: exactsum-linux17-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compact-precision:
    name: Gale adoption on native Linux x64
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      COURSIER_REPOSITORIES: https://repo.maven.apache.org/maven2
      SBT_OPTS: -Xmx4g -XX:ActiveProcessorCount=4 -Dsbt.supershell=false -Dsbt.color=false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Resolve exact historical JDK
        id: exact-jdk
        continue-on-error: true
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17.0.20+1"
      - name: Resolve current declared JDK if historical cache is unavailable
        if: steps.exact-jdk.outcome == 'failure'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"
      - uses: sbt/setup-sbt@0fb5a646ec2dc21653246d4dbc153a8468749b55
        with:
          sbt-runner-version: "1.11.7"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.21.0"
          package-manager-cache: false
      - name: Record host and source fingerprint
        run: |
          mkdir -p diagnostics
          uname -a > diagnostics/host.txt
          cat /etc/os-release >> diagnostics/host.txt
          java -version 2>> diagnostics/host.txt
          node --version >> diagnostics/host.txt
          node -p 'JSON.stringify(process.versions)' >> diagnostics/host.txt
          ldd --version >> diagnostics/host.txt
          git rev-parse HEAD > diagnostics/source-commit.txt
          sha256sum build.sbt modules/ar/shared/src/main/scala/scalafim/fmri/ar/ArEstimation.scala modules/ar/shared/src/main/scala/scalafim/fmri/ar/ArError.scala modules/ar/shared/src/test/scala/scalafim/fmri/ar/ArNoiseReductionSuite.scala modules/design/shared/src/main/scala/scalafim/fmri/design/hrf/KernelBasisBudget.scala > diagnostics/source-sha256.txt
      - name: Published Gale AR and compiler budget gates
        run: |
          set +e
          sbt "arJVM/test" "designJVM/testOnly scalafim.fmri.design.hrf.KernelBasisBudgetSuite scalafim.fmri.design.HrfKernelBasisSuite" > diagnostics/gate.log 2>&1
          result=$?
          echo "$result" > diagnostics/gate-exit-code.txt
          exit "$result"
      - name: Upload complete gate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: exactsum-linux17-${{ github.run_id }}
          path: diagnostics/
          if-no-files-found: error
          retention-days: 14
