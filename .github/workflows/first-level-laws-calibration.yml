name: first-level-laws-calibration
run-name: generated first-level calibration (${{ github.event_name }})

on:
  schedule:
    - cron: "41 5 * * 3"
  workflow_dispatch:

concurrency:
  group: first-level-laws-calibration-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  generated-laws:
    name: generated laws on JVM and Scala.js (seed ${{ matrix.seed_long }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        seed_long:
          - "97131249"
          - "324508639"
          - "610839776"
    env:
      SCALAFIM_LAW_PROFILE: calibration
      SCALAFIM_LAW_SEED_LONG: ${{ matrix.seed_long }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the declared JDK baseline
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up sbt
        uses: sbt/setup-sbt@0fb5a646ec2dc21653246d4dbc153a8468749b55 # v1.5.8

      - name: Set up the declared Scala.js Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Run the calibration profile
        shell: bash
        env:
          SCALAFIM_SBT_CACHE_ROOT: ${{ runner.temp }}/scalafim-first-level-laws-sbt
        run: |
          cache_root="$SCALAFIM_SBT_CACHE_ROOT"
          mkdir -p "$cache_root"
          export COURSIER_CACHE="$cache_root/coursier"
          sbt \
            -Dsbt.boot.directory="$cache_root/boot" \
            -Dsbt.global.base="$cache_root/global" \
            -Dsbt.ivy.home="$cache_root/ivy" \
            -Dsbt.supershell=false \
            firstLevelLawsJVM/test \
            firstLevelLawsJS/test
