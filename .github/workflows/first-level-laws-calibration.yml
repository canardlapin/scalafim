name: first-level-laws-calibration
run-name: final published precision and frozen LWU qualification on native Linux
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: precision-lwu-final-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  final-qualification:
    name: final precision and LWU (${{ matrix.platform }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform: [JVM, JS]
    env:
      COURSIER_REPOSITORIES: https://repo.maven.apache.org/maven2
    steps:
      - name: Check out final candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Initialize retained evidence
        run: mkdir -p diagnostics/${{ matrix.platform }}
      - name: Resolve exact historical JDK
        id: exact-jdk
        continue-on-error: true
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17.0.20+1"
      - name: Resolve declared JDK baseline if exact historical build is unavailable
        if: steps.exact-jdk.outcome == 'failure'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up sbt
        uses: sbt/setup-sbt@0fb5a646ec2dc21653246d4dbc153a8468749b55
        with:
          sbt-runner-version: "1.11.7"
      - name: Set up exact scientific Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.21.0"
          package-manager-cache: false
      - name: Run default published precision, kernel, LWU and full fit gates
        env:
          SCALAFIM_SBT_CACHE_ROOT: ${{ runner.temp }}/scalafim-final-${{ matrix.platform }}
          SCALAFIM_QUALIFICATION_DIR: ${{ github.workspace }}/diagnostics/${{ matrix.platform }}
        run: bash tools/qualification/precision-lwu-final.sh ${{ matrix.platform }}
      - name: Upload complete source and scientific outcome evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: precision-lwu-final-${{ matrix.platform }}-${{ github.run_id }}
          path: diagnostics/${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 14
