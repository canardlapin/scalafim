name: first-level-laws-calibration
run-name: bounded Linux compact-condition precision diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: linux-cohort-diagnostic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compact-precision:
    name: compact cohort precision on Linux x64
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      COURSIER_REPOSITORIES: https://repo.maven.apache.org/maven2
      SBT_OPTS: -Xmx4g -XX:ActiveProcessorCount=4 -Dsbt.supershell=false -Dsbt.color=false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Resolve exact historical JDK
        id: exact-jdk
        continue-on-error: true
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17.0.20+1"
      - name: Resolve current declared JDK if historical cache is unavailable
        if: steps.exact-jdk.outcome == 'failure'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"
      - uses: sbt/setup-sbt@0fb5a646ec2dc21653246d4dbc153a8468749b55
        with:
          sbt-runner-version: "1.11.7"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.21.0"
          package-manager-cache: false
      - name: Record host and source fingerprint
        run: |
          mkdir -p diagnostics
          uname -a > diagnostics/host.txt
          cat /etc/os-release >> diagnostics/host.txt
          java -version 2>> diagnostics/host.txt
          node --version >> diagnostics/host.txt
          node -p 'JSON.stringify(process.versions)' >> diagnostics/host.txt
          ldd --version >> diagnostics/host.txt
          git rev-parse HEAD > diagnostics/source-commit.txt
          sha256sum modules/fit/shared/src/main/scala/scalafim/fmri/fit/profile/ShapeDecoder.scala modules/first-level-laws/shared/src/test/scala/scalafim/fmri/laws/profile/CompactConditionRuntimeSuite.scala > diagnostics/source-sha256.txt
      - name: Capture unmodified baseline in separate JVM and JS processes
        continue-on-error: true
        run: |
          suite=modules/first-level-laws/shared/src/test/scala/scalafim/fmri/laws/profile/CompactConditionRuntimeSuite.scala
          trap 'git checkout -- "$suite"' EXIT
          git show 37a84e99:"$suite" > "$suite"
          sha256sum "$suite" > diagnostics/baseline-suite-sha256.txt
          set +e
          sbt "firstLevelLawsJVM/testOnly scalafim.fmri.laws.profile.CompactConditionRuntimeSuite" > diagnostics/baseline-jvm.log 2>&1
          jvm_result=$?
          echo "$jvm_result" > diagnostics/baseline-jvm-exit-code.txt
          sbt "firstLevelLawsJS/testOnly scalafim.fmri.laws.profile.CompactConditionRuntimeSuite" > diagnostics/baseline-js.log 2>&1
          js_result=$?
          echo "$js_result" > diagnostics/baseline-js-exit-code.txt
          if [ "$jvm_result" -ne 0 ] || [ "$js_result" -ne 0 ]; then exit 1; fi
      - name: Capture JVM cohort diagnostic without changing assertions
        continue-on-error: true
        run: |
          set +e
          sbt "firstLevelLawsJVM/testOnly scalafim.fmri.laws.profile.CompactConditionRuntimeSuite" > diagnostics/jvm.log 2>&1
          result=$?
          echo "$result" > diagnostics/jvm-exit-code.txt
          exit "$result"
      - name: Capture JS cohort diagnostic without changing assertions
        continue-on-error: true
        run: |
          set +e
          sbt "firstLevelLawsJS/testOnly scalafim.fmri.laws.profile.CompactConditionRuntimeSuite" > diagnostics/js.log 2>&1
          result=$?
          echo "$result" > diagnostics/js-exit-code.txt
          exit "$result"
      - name: Upload complete diagnostics regardless of scientific outcome
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: compact-precision-linux-${{ github.run_id }}
          path: diagnostics/
          if-no-files-found: error
          retention-days: 14
