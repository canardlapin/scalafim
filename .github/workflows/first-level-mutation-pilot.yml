name: first-level-mutation-pilot
run-name: first-level AR and NA mutation pilot (${{ github.event_name }})

on:
  schedule:
    - cron: "17 6 * * 6"
  workflow_dispatch:

concurrency:
  group: first-level-mutation-pilot-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mutation-pilot:
    name: 22 seeded AR and missing-data mutants
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the declared JDK baseline
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up sbt
        uses: sbt/setup-sbt@0fb5a646ec2dc21653246d4dbc153a8468749b55 # v1.5.8

      - name: Run the focused mutation pilot
        env:
          SCALAFIM_MUTATION_OUT: ${{ runner.temp }}/first-level-mutation-pilot
          SCALAFIM_SBT_CACHE_ROOT: ${{ runner.temp }}/scalafim-mutation-pilot-sbt
        run: python3 tools/mutation/ar_na_pilot.py

      - name: Upload mutation logs and summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: first-level-mutation-pilot-${{ github.sha }}
          path: ${{ runner.temp }}/first-level-mutation-pilot
          if-no-files-found: error
          retention-days: 30
