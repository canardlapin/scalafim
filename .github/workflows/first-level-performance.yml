name: first-level-performance
run-name: first-level performance (${{ github.event_name }})

on:
  schedule:
    - cron: "23 7 * * 4"
  workflow_dispatch:

concurrency:
  group: first-level-performance-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  jmh-admission:
    name: HRF, AR, and fit JMH admission court
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the declared JDK baseline
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up sbt
        uses: sbt/setup-sbt@0fb5a646ec2dc21653246d4dbc153a8468749b55 # v1.5.8

      - name: Run HRF, AR, and fit admission benchmarks
        env:
          SCALAFIM_BENCHMARK_OUT: ${{ runner.temp }}/first-level-benchmarks
          SCALAFIM_SBT_CACHE_ROOT: ${{ runner.temp }}/scalafim-first-level-benchmark-sbt
        run: bash tools/ci/first-level-benchmark.sh

      - name: Upload raw JMH reports and admission receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: first-level-performance-${{ github.sha }}
          path: ${{ runner.temp }}/first-level-benchmarks
          if-no-files-found: error
          retention-days: 30
