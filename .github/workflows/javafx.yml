name: JavaFX compatibility

on:
  pull_request:
    paths:
      - build.sbt
      - project/**
      - modules/image-view*/**
      - modules/surface*/**
      - examples/surface-view/**
      - .github/workflows/javafx.yml
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  viewers:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        javafx: ["21.0.5", "24.0.2"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "22"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      - name: Test JavaFX hosts and portable viewers
        run: >-
          sbt -batch -Dsbt.supershell=false
          -Dscalafim.javafx.version=${{ matrix.javafx }}
          imageViewJavafxJVM/test surfaceViewJavafxJVM/test
          surfaceViewExamplesJVM/test imageViewJVM/test imageViewJS/test
          surfaceViewJVM/test surfaceViewJS/test surfaceViewExamplesJS/test
