name: scenario-receipts
run-name: scenario receipts (${{ github.event_name == 'schedule' && 'nightly' || inputs.lane }})

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      lane:
        description: Evidence lane recorded for this run
        required: true
        default: nightly
        type: choice
        options:
          - nightly
          - release

concurrency:
  group: scenario-receipts-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  SCALAFIM_EVIDENCE_LANE: ${{ github.event_name == 'schedule' && 'nightly' || inputs.lane }}

jobs:
  r-receipts:
    name: locked R receipt regeneration
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Record the evidence lane
        shell: bash
        run: |
          echo "Evidence lane: $SCALAFIM_EVIDENCE_LANE" >> "$GITHUB_STEP_SUMMARY"

      - name: Check out ScalaFIM
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the checked-in environment lock
        id: lock
        shell: bash
        run: |
          echo "r_version=$(jq -r '.r.version' tools/r-parity/reference-lock.json)" >> "$GITHUB_OUTPUT"
          echo "fmriar=$(jq -r '.r.packages.fmriAR.revision' tools/r-parity/reference-lock.json)" >> "$GITHUB_OUTPUT"
          echo "fmridesign=$(jq -r '.r.packages.fmridesign.revision' tools/r-parity/reference-lock.json)" >> "$GITHUB_OUTPUT"
          echo "fmrihrf=$(jq -r '.r.packages.fmrihrf.revision' tools/r-parity/reference-lock.json)" >> "$GITHUB_OUTPUT"
          echo "fmrireg=$(jq -r '.r.packages.fmrireg.revision' tools/r-parity/reference-lock.json)" >> "$GITHUB_OUTPUT"

      - name: Check out fmriAR at the locked revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bbuchsbaum/fmriAR
          ref: ${{ steps.lock.outputs.fmriar }}
          path: reference/fmriAR

      - name: Check out fmridesign at the locked revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bbuchsbaum/fmridesign
          ref: ${{ steps.lock.outputs.fmridesign }}
          path: reference/fmridesign

      - name: Check out fmrihrf at the locked revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bbuchsbaum/fmrihrf
          ref: ${{ steps.lock.outputs.fmrihrf }}
          path: reference/fmrihrf

      - name: Check out fmrireg at the locked revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bbuchsbaum/fmrireg
          ref: ${{ steps.lock.outputs.fmrireg }}
          path: reference/fmrireg

      - name: Set up locked R
        uses: r-lib/actions/setup-r@aae88a2d9cd3d63571eb05980b09f44611788515 # v2-branch
        with:
          r-version: ${{ steps.lock.outputs.r_version }}
          use-public-rspm: true

      - name: Install fmridesign dependencies
        uses: r-lib/actions/setup-r-dependencies@aae88a2d9cd3d63571eb05980b09f44611788515 # v2-branch
        with:
          working-directory: reference/fmridesign
          dependencies: '"hard"'
          packages: |
            deps::.
            any::jsonlite
            any::pkgload
          install-pandoc: false
          install-quarto: false

      - name: Install fmriAR dependencies
        uses: r-lib/actions/setup-r-dependencies@aae88a2d9cd3d63571eb05980b09f44611788515 # v2-branch
        with:
          working-directory: reference/fmriAR
          dependencies: '"hard"'
          packages: |
            deps::.
            any::jsonlite
          install-pandoc: false
          install-quarto: false

      - name: Install the locked local R references
        shell: bash
        run: |
          R CMD INSTALL reference/fmriAR
          R CMD INSTALL reference/fmrihrf
          R CMD INSTALL reference/fmridesign

      - name: Regenerate every R receipt
        env:
          FMRIAR_R: ${{ github.workspace }}/reference/fmriAR
          FMRIDESIGN_R: ${{ github.workspace }}/reference/fmridesign
          FMRIHRF_R: ${{ github.workspace }}/reference/fmrihrf
          FMRIREG_R: ${{ github.workspace }}/reference/fmrireg
        run: bash tools/r-parity/regenerate_receipts.sh --r-only

      - name: Capture the R receipt diff
        if: always()
        shell: bash
        run: |
          git diff -- \
            'docs/scenarios/fixtures/*.r.json' \
            'modules/ar/shared/src/test/scala/scalafim/fmri/ar/fixtures/*RFixture.scala' \
            'modules/design/shared/src/test/scala/scalafim/fmri/design/fixtures/*RFixture.scala' \
            'modules/fit/shared/src/test/scala/scalafim/fmri/fit/fixtures/*RFixture.scala' \
            modules/fit/shared/src/test/scala/scalafim/fmri/fit/fixtures/FmriArEstimatedGlsFixture.scala \
            > scenario-r-receipts.patch

      - name: Require checked-in R receipts to be current
        shell: bash
        run: test ! -s scenario-r-receipts.patch

      - name: Upload stale R receipt evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stale-r-receipts
          path: scenario-r-receipts.patch
          if-no-files-found: error

  python-receipts:
    name: locked Python and Nilearn receipt regeneration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Record the evidence lane
        shell: bash
        run: |
          echo "Evidence lane: $SCALAFIM_EVIDENCE_LANE" >> "$GITHUB_STEP_SUMMARY"

      - name: Check out ScalaFIM
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the checked-in environment lock
        id: lock
        shell: bash
        run: |
          echo "python_version=$(jq -r '.python.version' tools/r-parity/reference-lock.json)" >> "$GITHUB_OUTPUT"
          echo "fmrimod=$(jq -r '.python.packages.fmrimod.revision' tools/r-parity/reference-lock.json)" >> "$GITHUB_OUTPUT"
          echo "numpy=$(jq -r '.python.packages.numpy.version' tools/r-parity/reference-lock.json)" >> "$GITHUB_OUTPUT"
          echo "scipy=$(jq -r '.python.packages.scipy.version' tools/r-parity/reference-lock.json)" >> "$GITHUB_OUTPUT"
          echo "nilearn=$(jq -r '.python.packages.nilearn.version' tools/r-parity/reference-lock.json)" >> "$GITHUB_OUTPUT"

      - name: Check out fmrimod at the locked revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bbuchsbaum/fmrimod
          ref: ${{ steps.lock.outputs.fmrimod }}
          path: reference/fmrimod

      - name: Set up locked Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ steps.lock.outputs.python_version }}

      - name: Install locked numerical references
        run: >-
          python -m pip install
          "numpy==${{ steps.lock.outputs.numpy }}"
          "scipy==${{ steps.lock.outputs.scipy }}"
          "nilearn==${{ steps.lock.outputs.nilearn }}"

      - name: Regenerate every Python receipt
        env:
          FMRIMOD_ROOT: ${{ github.workspace }}/reference/fmrimod
        run: bash tools/r-parity/regenerate_receipts.sh --python-only

      - name: Capture the Python receipt diff
        if: always()
        shell: bash
        run: |
          git diff -- \
            docs/scenarios/fixtures/fit.public-f-contrast.v1.nilearn.json \
            modules/fit/shared/src/test/scala/scalafim/fmri/fit/scenarios/PublicFContrastNilearnFixture.scala \
            > scenario-python-receipts.patch

      - name: Require checked-in Python receipts to be current
        shell: bash
        run: test ! -s scenario-python-receipts.patch

      - name: Upload stale Python receipt evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stale-python-receipts
          path: scenario-python-receipts.patch
          if-no-files-found: error
