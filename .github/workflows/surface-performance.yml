name: surface-performance
run-name: surface performance (${{ github.event_name }})

on:
  schedule:
    - cron: "19 8 * * 1"
  workflow_dispatch:

concurrency:
  group: surface-performance-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  surface-performance-court:
    name: JVM allocation and Scala.js topology budgets
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up the declared JDK baseline
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up the declared Scala.js Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Run correctness invariants and broad hosted-runner budgets
        env:
          SCALAFIM_SBT_CACHE_ROOT: ${{ runner.temp }}/scalafim-surface-performance-sbt
          SCALAFIM_SURFACE_PERFORMANCE_OUT: ${{ runner.temp }}/surface-performance
        run: bash tools/ci/surface-performance-gate.sh

      - name: Upload raw logs and the combined admission receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: surface-performance-${{ github.sha }}
          path: ${{ runner.temp }}/surface-performance
          if-no-files-found: error
          retention-days: 30
