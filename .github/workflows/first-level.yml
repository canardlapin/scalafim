name: first-level-ci

on:
  pull_request:
  push:
    branches:
      - main
      - master

concurrency:
  group: first-level-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  full-repository:
    name: full repository JVM/Scala.js compile and test
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the declared JDK baseline
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up sbt
        uses: sbt/setup-sbt@0fb5a646ec2dc21653246d4dbc153a8468749b55 # v1.5.8

      - name: Set up the declared Scala.js Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Compile every JVM and Scala.js module
        env:
          COURSIER_CACHE: ${{ runner.temp }}/scalafim-full-repository-sbt/coursier
        run: >-
          sbt
          -Dsbt.boot.directory=${{ runner.temp }}/scalafim-full-repository-sbt/boot
          -Dsbt.global.base=${{ runner.temp }}/scalafim-full-repository-sbt/global
          -Dsbt.ivy.home=${{ runner.temp }}/scalafim-full-repository-sbt/ivy
          -Dsbt.supershell=false
          scalafimCompileAll

      - name: Test every headless JVM and Scala.js module in bounded batches
        env:
          SCALAFIM_SBT_CACHE_ROOT: ${{ runner.temp }}/scalafim-full-repository-sbt
        run: bash tools/ci/full-repository-tests.sh

  focused-first-level:
    name: focused first-level JVM/Scala.js gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the declared JDK baseline
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up sbt
        uses: sbt/setup-sbt@0fb5a646ec2dc21653246d4dbc153a8468749b55 # v1.5.8

      - name: Set up the declared Scala.js Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Run manifest, fixture, JVM, and Scala.js gates
        env:
          SCALAFIM_SBT_CACHE_ROOT: ${{ runner.temp }}/scalafim-first-level-sbt
        run: bash tools/ci/first-level-gate.sh

  scientific-coverage:
    name: scoped first-level scientific coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the declared JDK baseline
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up sbt
        uses: sbt/setup-sbt@0fb5a646ec2dc21653246d4dbc153a8468749b55 # v1.5.8

      - name: Enforce per-module scientific coverage floors
        env:
          SCALAFIM_SBT_CACHE_ROOT: ${{ runner.temp }}/scalafim-first-level-coverage-sbt
        run: bash tools/ci/first-level-coverage.sh
